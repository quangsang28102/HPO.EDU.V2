<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xem thử card Hệ thống HPO</title>
  <!-- Trang xem thử độc lập cho gói bàn giao; không thuộc website -->
  <base href="files/" />
  <link rel="stylesheet" href="assets/css/homepage-hpo-system-card-motion.css" />
  <style>body { margin: 0; padding: 40px 16px; background: #f4f8fd; font-family: system-ui, sans-serif; }</style>
</head>
<body>
              <div class="hpo-sys-card" aria-label="Hệ thống HPO và trợ lý ảo AI">
                <figure class="hpo-sys-item">
                  <div class="hpo-sys-ring">
                    <img src="assets/images/hero/hpo-system-circle.webp" alt="Sơ đồ hệ thống HPO: xác thực khuôn mặt, cloud, DAT, cabin, mô phỏng, đa nền tảng" width="362" height="362" />
                    <!-- Lớp chuyển động phủ lên ảnh: tia quét, sóng lan từ xe, gói dữ liệu (SVG do JS vẽ) -->
                    <span class="hpo-sys-sweep" aria-hidden="true"></span>
                    <span class="hpo-sys-ripple" aria-hidden="true"></span>
                    <span class="hpo-sys-ripple hpo-sys-ripple--late" aria-hidden="true"></span>
                    <svg class="hpo-sys-motion" viewBox="0 0 362 362" aria-hidden="true"></svg>
                  </div>
                  <figcaption>HỆ THỐNG HPO</figcaption>
                </figure>
                <figure class="hpo-sys-item">
                  <div class="hpo-sys-ai-stage">
                    <span class="hpo-sys-chat-bubble" aria-hidden="true"><i></i><i></i><i></i></span>
                    <img class="hpo-sys-ai-robot" src="assets/images/hero/hpo-ai-assistant-robot-waving.webp" alt="Robot trợ lý ảo AI vẫy tay" width="159" height="235" />
                  </div>
                  <figcaption>TRỢ LÝ ẢO AI</figcaption>
                </figure>
              </div>
  <script src="assets/js/homepage-hpo-system-card-motion.js"></script>
</body>
</html>
